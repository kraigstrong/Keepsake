<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Keepsake</title>
    <style>
      :root {
        color-scheme: light dark;
        --ink: #1c1917;
        --muted: #57534e;
        --paper: #fdfcfb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #e7e5e4;
          --muted: #a8a29e;
          --paper: #1c1917;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: var(--paper);
        color: var(--ink);
        font:
          16px/1.6 ui-serif,
          Georgia,
          'Times New Roman',
          serif;
        text-align: center;
      }
      h1 {
        font-size: 2rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: var(--muted);
        margin: 0 0 1.5rem;
      }
      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Keepsake</h1>
      <p>A calm recipe app for households. Currently in private beta.</p>
      <p><a href="/privacy.html">Privacy policy</a></p>
    </main>
  </body>
</html>
