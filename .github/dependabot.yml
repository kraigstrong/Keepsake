version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      expo-ecosystem:
        patterns:
          - "expo*"
          - "react-native*"
          - "@expo/*"
          - "react"
          - "react-dom"
      other-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "expo*"
          - "react-native*"
          - "@expo/*"
          - "react"
          - "react-dom"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # eslint-config-expo and jest-expo pin their own compatible versions
      # of these — bumping major versions independently breaks things (see
      # PRs #7, #8, #9: eslint 10 and typescript 7 broke eslint-config-expo's
      # bundled plugins, jest bumped ahead of jest-expo's internal
      # jest-runtime). Let Expo's own config upgrades pull these forward
      # instead of Dependabot proposing them independently.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jest"
        update-types: ["version-update:semver-major"]

      # Reanimated raises its react-native-worklets peer floor in *minor*
      # releases, ahead of what the current Expo SDK allows: 4.6.0 wants
      # worklets 0.12.x while expo-modules-core@57 caps it at ^0.10.0, so
      # `npm ci` fails to resolve (PR #202, closed for this). Expo pins
      # reanimated exactly for that reason — let an SDK upgrade move it.
      # Patches stay open: 4.5.x keeps the 0.10.x - 0.11.x peer range.
      - dependency-name: "react-native-reanimated"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
