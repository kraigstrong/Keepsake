name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Typecheck, lint, format, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # The lockfile is written by npm 11, and npm 10 computes a different
      # tree from it (it requires a nested optional-peer typescript that
      # npm 11 omits) — which is what froze every Dependabot PR. .nvmrc
      # pins Node, but Node only pins npm indirectly, so pin it directly.
      - run: npm install --global npm@11

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test -- --ci
      - run: npm run check:client-secrets

  database:
    name: Migration apply/reset and RLS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # The lockfile is written by npm 11, and npm 10 computes a different
      # tree from it (it requires a nested optional-peer typescript that
      # npm 11 omits) — which is what froze every Dependabot PR. .nvmrc
      # pins Node, but Node only pins npm indirectly, so pin it directly.
      - run: npm install --global npm@11

      - run: npm ci

      # `supabase start` applies every migration in supabase/migrations/
      # to a fresh local database — this is the "apply" half of migration
      # verification.
      - run: npx supabase start

      # Supabase migrations are forward-only (no per-migration down
      # script); `db reset` drops and re-applies all migrations from
      # scratch, which is the project's equivalent "rollback" check —
      # it catches non-idempotent or order-dependent migrations.
      - run: npx supabase db reset

      - run: npx supabase test db --local supabase/tests/database

      - if: always()
        run: npx supabase stop

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: Dependency scan (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # The lockfile is written by npm 11, and npm 10 computes a different
      # tree from it (it requires a nested optional-peer typescript that
      # npm 11 omits) — which is what froze every Dependabot PR. .nvmrc
      # pins Node, but Node only pins npm indirectly, so pin it directly.
      - run: npm install --global npm@11

      - run: npm ci

      # Fails only within dependencies that ship in the app or server
      # bundle (--omit=dev). Two known, accepted gaps this currently
      # hides:
      # - Moderate: uuid <11.1.1 via xcode -> @expo/config-plugins -> expo
      #   CLI internals (regular dependency, but moderate stays below the
      #   high/critical threshold either way). See the "Wire up secret
      #   and dependency scanning" commit for the full reasoning.
      # - High: @xmldom/xmldom (XML injection/DoS, no fix available) via
      #   @bacons/apple-targets's own nested @bacons/xcode/@expo/plist
      #   tree. @bacons/apple-targets is a devDependency — it only runs
      #   during `expo prebuild` on a developer/CI machine to generate the
      #   Share Extension Xcode target; none of its code ships in the app
      #   or server bundle, so --omit=dev is the correct scope, not a
      #   blanket exception. Re-run without --omit=dev periodically to
      #   check whether upstream has picked up a fix.
      #
      # scripts/check-npm-audit.mjs wraps the raw `npm audit` (rather than
      # a bare --audit-level=high) so that a *new* high/critical finding
      # anywhere still fails the build — it only tolerates the two
      # specific, reviewed advisories documented in that script's own
      # allowlist (image-size, nanoid — both build-tooling-only, no
      # reachable path from real input to the shipped app), not every
      # future high-severity finding.
      - run: node scripts/check-npm-audit.mjs
